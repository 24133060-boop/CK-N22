spring.application.name=UTEMILKTEA
server.port=8080
spring.datasource.url=jdbc:sqlserver://localhost:${DB_PORT:14330};databaseName=UTEMILKTEA_DB;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:Aa@123456}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
server.error.include-message=never

# Force UTF-8 for requests and responses
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.messages.encoding=UTF-8

# Configure SMTP using environment variables. Do not commit credentials.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
app.mail.from=${SMTP_FROM:}

# Cloudinary: configure through environment variables. Never commit API secrets.
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB

# JWT for API only (session login for JSP stays unchanged)
app.jwt.secret=${JWT_SECRET:}

# VNPay sandbox V2.1 - callback requires public HTTPS URL in production
app.vnpay.tmn-code=${VNPAY_TMN_CODE:}
app.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
app.vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
app.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/payment/vnpay/return}

# VietQR (Vietcombank) - configure via environment variables
app.vietqr.bank-id=970436
app.vietqr.account-no=${VIETQR_ACCOUNT_NO:1034530110}
app.vietqr.account-name=${VIETQR_ACCOUNT_NAME:NGUYEN MINH TIEN}
